<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PanelLab – PLC AI Creative Agent</title>
  <link rel="stylesheet" href="css/panellab.css">
</head>
<body>
  <div id="app" class="app" data-view="chat">
    <aside class="nav" aria-label="주 메뉴">
      <div class="brand"><span class="logo">PL</span><span>PanelLab</span></div>
      <div class="proj">
        <label for="projectSelect" class="small">프로젝트</label>
        <select id="projectSelect"></select>
        <div id="projectName" class="pname"></div>
        <div id="projectMeta" class="small"></div>
        <button id="editProject" class="btn sm" type="button">프로젝트 설정</button>
      </div>
      <nav>
        <button data-nav="home" aria-current="page" type="button">홈</button>
        <button data-nav="work" type="button">AI 작업실</button>
        <button data-nav="draw" type="button">PLC 작화</button>
        <button data-nav="check" type="button">오류 검사</button>
        <button data-nav="code" type="button">코드 작성</button>
        <button data-nav="blueprint" type="button">도면 분석</button>
        <button data-nav="project" type="button">프로젝트</button>
        <button data-nav="history" type="button">작업 기록</button>
        <button data-nav="settings" type="button">설정</button>
      </nav>
    </aside>

    <main class="chat">
      <header class="chat-head">
        <div>
          <div class="eyebrow">PANEL LAB · AI WORKSPACE</div>
          <h1>AI 작업실</h1>
        </div>
        <div class="connection-chip"><span class="status-dot"></span><span id="connectionLabel">연결 확인 중</span></div>
      </header>
      <div id="status" class="status" role="status" aria-live="polite">
        <span id="statusText">채팅에 연결하는 중입니다...</span>
        <button id="retryConnect" class="btn sm" type="button" hidden>연결 재시도</button>
      </div>
      <div id="webchat"></div>
    </main>

    <section class="results" aria-label="PLC 작업 결과">
      <div class="result-head">
        <div>
          <div class="eyebrow">PROJECT OUTPUT</div>
          <h2>PLC 작업 결과</h2>
        </div>
        <button id="clearResults" class="btn sm" type="button" title="현재 프로젝트의 결과만 삭제">결과 비우기</button>
      </div>
      <label class="result-search">
        <span aria-hidden="true">⌕</span>
        <input id="resultSearch" type="search" placeholder="결과에서 검색..." aria-label="PLC 작업 결과 검색">
        <button id="clearSearch" type="button" aria-label="검색어 지우기" hidden>×</button>
      </label>
      <div id="resultTabs" class="tabs" role="tablist"></div>
      <div id="resultBody" class="rbody"></div>
    </section>

    <nav class="mobile-tabs" aria-label="화면 전환">
      <button class="mtab" data-view="chat" type="button">채팅</button>
      <button class="mtab" data-view="results" type="button">결과</button>
      <button class="mtab" data-view="menu" type="button">메뉴</button>
    </nav>
  </div>

  <dialog id="dlg">
    <div class="dlg-h"><h3 id="dlgTitle"></h3><button id="dlgClose" class="btn sm" type="button" aria-label="닫기">닫기</button></div>
    <div id="dlgBody"></div>
  </dialog>

  <script src="https://cdn.botframework.com/botframework-webchat/4.18.0/webchat.js"></script>
  <script src="js/analyzer.js"></script>
  <script src="js/diff.js"></script>
  <script src="js/projects.js"></script>
  <script src="js/conversations.js"></script>
  <script src="js/store.js"></script>
  <script src="js/connection.js"></script>
  <script src="js/panel.js"></script>
</body>
</html>
