name: Deploy PanelLab to Azure

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: panellab-azure-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require private Azure deployment configuration
        env:
          AZURE_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: |
          if [ -z "$AZURE_TOKEN" ]; then
            echo "::error::Set AZURE_STATIC_WEB_APPS_API_TOKEN in repository Actions secrets. Never commit or print its value."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Install API dependencies and validate
        run: |
          npm ci --prefix api
          node --test test/*.test.js api/test/*.test.js
      - name: Stage public frontend only
        run: |
          mkdir .panellab-deploy
          cp index.html staticwebapp.config.json .panellab-deploy/
          cp -R css js .panellab-deploy/
      - name: Deploy existing site and managed token API
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: .panellab-deploy
          api_location: api
          output_location: ""
          skip_app_build: true
